# Store PID in /tmp (this directory is always writable in containers)
# which prevents permission issues inside Docker containers
pid /tmp/nginx.pid;

events {}

http {
    access_log off;              # Avoids permission issues and reduces output noise
    error_log  /dev/stderr warn; # Send error logs to stderr for visibility in Docker

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       8080;
        server_name  _;

        # Route 1: Backend API traffic (Wrangler + Hono)
        location ^~ /api/v1/ {
            proxy_pass http://backend:3000;

            # Required for WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep long-lived WebSocket game connections from timing out
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Route 2: Standard web application frontend (Vite + Svelte)
        location ^~ / {
            proxy_pass http://frontend:3000;
        }
    }
}

